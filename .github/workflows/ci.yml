name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run fixture-free workspace tests
        run: cargo test --workspace --locked
      - name: Verify the Rust dependency notice payload
        run: python3 scripts/generate_rust_notice_payload.py --check

  provider-contracts:
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cpu
            cargo_args: --no-default-features
          - name: cuda
            cargo_args: --no-default-features --features cuda
          - name: tensorrt
            cargo_args: --no-default-features --features tensorrt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check the selected provider contract
        run: cargo check --workspace --all-targets --locked ${{ matrix.cargo_args }}
      - name: Lint the selected provider contract
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings
      - name: Test the selected provider contract
        run: cargo test --workspace --locked ${{ matrix.cargo_args }}

  all-feature-contracts:
    needs: provider-contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Compile the complete feature and target graph
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Lint the complete feature and target graph
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile external-artifact test targets without executing them
        run: cargo test --workspace --all-targets --all-features --no-run --locked

  image-definitions:
    needs: all-feature-contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile.cpu
          - name: cuda
            dockerfile: Dockerfile.cuda
          - name: tensorrt
            dockerfile: Dockerfile.tensorrt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify the declared Docker build context
        if: matrix.name == 'cpu'
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM scratch' \
            'COPY Cargo.toml Cargo.lock /workspace/' \
            'COPY crates /workspace/crates/' \
            'COPY COPYING COPYING.LESSER THIRD_PARTY.md /licenses/' \
            | docker buildx build --file - --output type=cacheonly .

          if printf '%s\n' 'FROM scratch' 'COPY docs/REQUIREMENTS.md /probe' \
            | docker buildx build --file - --output type=cacheonly .; then
            printf 'unexpected Docker context member: docs/REQUIREMENTS.md\n' >&2
            exit 1
          fi
      - name: Check Dockerfile construction policy
        run: >-
          docker buildx build --check --platform linux/amd64
          --file "${{ matrix.dockerfile }}" .
