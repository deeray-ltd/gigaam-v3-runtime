name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run fixture-free workspace tests
        run: cargo test --workspace --locked
      - name: Verify the Rust dependency notice payload
        run: python3 scripts/generate_rust_notice_payload.py --check

  provider-contracts:
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cpu
            cargo_args: --no-default-features
          - name: cuda
            cargo_args: --no-default-features --features cuda
          - name: tensorrt
            cargo_args: --no-default-features --features tensorrt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check the selected provider contract
        run: cargo check --workspace --all-targets --locked ${{ matrix.cargo_args }}
      - name: Lint the selected provider contract
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings
      - name: Test the selected provider contract
        run: cargo test --workspace --locked ${{ matrix.cargo_args }}

  all-feature-contracts:
    needs: provider-contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Compile the complete feature and target graph
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Lint the complete feature and target graph
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile external-artifact test targets without executing them
        run: cargo test --workspace --all-targets --all-features --no-run --locked

  images:
    needs: all-feature-contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile.cpu
            image: gigaam-v3-ci:cpu
            provider: cpu
          - name: cuda
            dockerfile: Dockerfile.cuda
            image: gigaam-v3-ci:cuda
            provider: cuda
          - name: tensorrt
            dockerfile: Dockerfile.tensorrt
            image: gigaam-v3-ci:tensorrt
            provider: tensorrt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify the declared Docker build context
        if: matrix.name == 'cpu'
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM scratch' \
            'COPY Cargo.toml Cargo.lock /workspace/' \
            'COPY crates /workspace/crates/' \
            'COPY COPYING COPYING.LESSER THIRD_PARTY.md /licenses/' \
            | docker buildx build --file - --output type=cacheonly .

          if printf '%s\n' 'FROM scratch' 'COPY docs/REQUIREMENTS.md /probe' \
            | docker buildx build --file - --output type=cacheonly .; then
            printf 'unexpected Docker context member: docs/REQUIREMENTS.md\n' >&2
            exit 1
          fi
      - name: Check Dockerfile construction policy
        run: >-
          docker buildx build --check --platform linux/amd64
          --file "${{ matrix.dockerfile }}" .
      - name: Build the selected release image
        run: >-
          docker buildx build --load --platform linux/amd64
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}" .
      - name: Verify the observable image contract
        env:
          IMAGE: ${{ matrix.image }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = gigaam
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${IMAGE}")" = '["/app/asr-serve","--model","/app/model","--port","8080"]'
          test "$(docker image inspect --format '{{if index .Config.ExposedPorts "8080/tcp"}}true{{else}}false{{end}}' "${IMAGE}")" = true
          test "$(docker run --rm --entrypoint /usr/bin/id "${IMAGE}" -u)" = 10001

          image_environment="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${IMAGE}")"
          printf '%s\n' "${image_environment}" | grep --fixed-strings --line-regexp --quiet "ASR_ENCODER_EP=${PROVIDER}"
          printf '%s\n' "${image_environment}" | grep --fixed-strings --line-regexp --quiet 'ORT_DYLIB_PATH=/app/ort/lib/libonnxruntime.so.1.29.0'
          if printf '%s\n' "${image_environment}" | grep --extended-regexp --line-regexp --quiet 'ASR_CUDA_(ASSIGNMENT_POLICY|CTC_ASSIGNMENT_SHA256|RNNT_ASSIGNMENT_SHA256)=.*'; then
            printf 'unexpected baked CUDA assignment environment in %s image\n' "${PROVIDER}" >&2
            exit 1
          fi

          case "${PROVIDER}" in
            cpu)
              expected_library_path=/app/ort/lib
              ;;
            cuda)
              expected_library_path=/app/ort/lib:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              ;;
            tensorrt)
              expected_library_path=/app/ort/lib:/app/tensorrt:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              ;;
            *)
              printf 'unknown provider: %s\n' "${PROVIDER}" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "${image_environment}" | grep --fixed-strings --line-regexp --quiet "LD_LIBRARY_PATH=${expected_library_path}"

          case "${PROVIDER}" in
            tensorrt)
              printf '%s\n' "${image_environment}" | grep --fixed-strings --line-regexp --quiet 'ASR_TRT_CACHE=/app/trt-cache'
              ;;
            cpu|cuda)
              if printf '%s\n' "${image_environment}" | grep --fixed-strings --line-regexp --quiet 'ASR_TRT_CACHE=/app/trt-cache'; then
                printf 'unexpected TensorRT cache environment in %s image\n' "${PROVIDER}" >&2
                exit 1
              fi
              ;;
          esac

          docker run --rm --user root --entrypoint /bin/sh "${IMAGE}" -ceu '
            test -x /app/asr-serve
            test -f /app/ort/lib/libonnxruntime.so
            test -f /app/ort/lib/libonnxruntime.so.1
            test -f /app/ort/lib/libonnxruntime.so.1.29.0
            test -f /app/ort/lib/libonnxruntime_providers_shared.so
            test -f /usr/share/licenses/gigaam-v3-runtime/onnxruntime/LICENSE
            test -f /usr/share/licenses/gigaam-v3-runtime/onnxruntime/ThirdPartyNotices.txt
            test -f /usr/share/licenses/gigaam-v3-runtime/COPYING
            test -f /usr/share/licenses/gigaam-v3-runtime/COPYING.LESSER
            test -f /usr/share/licenses/gigaam-v3-runtime/THIRD_PARTY.md
            test -f /usr/share/licenses/gigaam-v3-runtime/rust/NOTICE.md
            test -d /usr/share/licenses/gigaam-v3-runtime/rust/texts
            test -n "$(find /usr/share/licenses/gigaam-v3-runtime/rust/texts -type f -print -quit)"

            for absent_path in \
              /src \
              /target \
              /app/model \
              /app/crates \
              /app/Cargo.toml \
              /app/Cargo.lock \
              /usr/local/cargo \
              /usr/local/rustup \
              /root/.cargo \
              /root/.rustup \
              /tmp/rustup-init \
              /tmp/onnxruntime.tgz \
              /tmp/tensorrt.whl \
              /opt/ort; do
              test ! -e "${absent_path}"
            done
            ! command -v python >/dev/null 2>&1
            ! command -v python3 >/dev/null 2>&1
            ! command -v pip >/dev/null 2>&1
            ! command -v pip3 >/dev/null 2>&1
          '

          case "${PROVIDER}" in
            cpu)
              docker run --rm --user root --entrypoint /bin/sh "${IMAGE}" -ceu '
                test ! -e /app/ort/lib/libonnxruntime_providers_cuda.so
                test ! -e /app/ort/lib/libonnxruntime_providers_tensorrt.so
                test ! -e /app/tensorrt
                test ! -e /app/trt-cache
                test ! -e /usr/share/licenses/gigaam-v3-runtime/tensorrt
              '
              ;;
            cuda)
              docker run --rm --user root --entrypoint /bin/sh "${IMAGE}" -ceu '
                test -f /app/ort/lib/libonnxruntime_providers_cuda.so
                test ! -e /app/ort/lib/libonnxruntime_providers_tensorrt.so
                test ! -e /app/tensorrt
                test ! -e /app/trt-cache
                test ! -e /usr/share/licenses/gigaam-v3-runtime/tensorrt
              '
              ;;
            tensorrt)
              docker run --rm --user root --entrypoint /bin/sh "${IMAGE}" -ceu '
                test -f /app/ort/lib/libonnxruntime_providers_cuda.so
                test -f /app/ort/lib/libonnxruntime_providers_tensorrt.so
                test -d /app/tensorrt
                test -f /app/tensorrt/libnvinfer.so.10
                test -f /app/tensorrt/libnvinfer_builder_resource.so.10.13.3
                test -f /app/tensorrt/libnvinfer_plugin.so.10
                test -f /app/tensorrt/libnvonnxparser.so.10
                test -f /usr/share/licenses/gigaam-v3-runtime/tensorrt/LICENSE
                test -d /app/trt-cache
                test ! -e /app/tensorrt/tensorrt_cu13_libs-10.13.3.9-py2.py3-none-manylinux_2_28_x86_64.whl
              '
              docker run --rm --entrypoint /bin/sh "${IMAGE}" -ceu 'test -w /app/trt-cache'
              ;;
          esac

          docker run --rm --user root --env PROVIDER="${PROVIDER}" --entrypoint /bin/sh "${IMAGE}" -ceu '
            case "${PROVIDER}" in
              cpu)
                set -- \
                  /app/asr-serve \
                  /app/ort/lib/libonnxruntime.so.1.29.0 \
                  /app/ort/lib/libonnxruntime_providers_shared.so
                ;;
              cuda)
                set -- \
                  /app/asr-serve \
                  /app/ort/lib/libonnxruntime.so.1.29.0 \
                  /app/ort/lib/libonnxruntime_providers_shared.so \
                  /app/ort/lib/libonnxruntime_providers_cuda.so
                ;;
              tensorrt)
                set -- \
                  /app/asr-serve \
                  /app/ort/lib/libonnxruntime.so.1.29.0 \
                  /app/ort/lib/libonnxruntime_providers_shared.so \
                  /app/ort/lib/libonnxruntime_providers_cuda.so \
                  /app/ort/lib/libonnxruntime_providers_tensorrt.so \
                  /app/tensorrt/libnvinfer.so.10 \
                  /app/tensorrt/libnvinfer_builder_resource.so.10.13.3 \
                  /app/tensorrt/libnvinfer_plugin.so.10 \
                  /app/tensorrt/libnvonnxparser.so.10
                ;;
              *)
                exit 1
                ;;
            esac

            missing="$(ldd "$@" | awk "/=> not found/ { print \$1 }")"
            case "${PROVIDER}" in
              cpu)
                test -z "${missing}"
                ;;
              cuda|tensorrt)
                for missing_library in ${missing}; do
                  case "${missing_library}" in
                    libcuda.so.1|libnvidia-*.so.[0-9]*)
                      ;;
                    *)
                      printf "unexpected missing image-local dependency: %s\\n" "${missing_library}" >&2
                      exit 1
                      ;;
                  esac
                done
                ;;
            esac
          '

          startup_log="$(mktemp)"
          trap 'rm -f "${startup_log}"' EXIT
          run_startup() {
            : >"${startup_log}"
            set +e
            timeout 20s docker run --rm --env LANG=C --env LC_ALL=C "$@" "${IMAGE}" >"${startup_log}" 2>&1
            startup_status=$?
            set -e
            cat "${startup_log}"
            test "${startup_status}" -ne 0
            test "${startup_status}" -ne 124
          }

          case "${PROVIDER}" in
            cuda)
              run_startup
              grep --fixed-strings --quiet 'ASR_CUDA_CTC_ASSIGNMENT_SHA256 is required for verified CUDA CTC composition' "${startup_log}"
              run_startup --env ASR_CUDA_ASSIGNMENT_POLICY=allow-unverified
              ;;
            cpu|tensorrt)
              run_startup
              ;;
            *)
              printf 'unknown provider: %s\n' "${PROVIDER}" >&2
              exit 1
              ;;
          esac
          grep --fixed-strings --quiet 'model: No such file or directory (os error 2)' "${startup_log}"
