[workspace]
members = [
    "crates/primitives",
    "crates/model-package",
    "crates/audio",
    "crates/recognition",
    "crates/transcription",
    "crates/service",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
license = "LGPL-3.0-or-later"
repository = "https://github.com/deeray-ltd/gigaam-v3-runtime"
authors = ["Yuriy Krasilnikov <yury.krasilnikov@gmail.com>", "Deeray Ltd."]

[profile.release]
opt-level = 3
lto = "thin"
