[workspace]
members = [
    "crates/primitives",
    "crates/model-package",
    "crates/audio",
    "crates/format-wav",
    "crates/format-raw",
    "crates/format-codecs",
    "crates/recognition",
    "crates/transcription",
    "crates/service",
    "crates/service-host",
    "crates/api-native",
    "crates/api-openai",
    "crates/cli",
]
exclude = [
    "crates/third-party/symphonia-format-isomp4",
    "crates/third-party/symphonia-format-mkv",
    "crates/third-party/symphonia-format-ogg",
    "crates/third-party/symphonia-codec-vorbis",
    "crates/third-party/symphonia-format-riff",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
license = "LGPL-3.0-or-later"
repository = "https://github.com/deeray-ltd/gigaam-v3-runtime"
authors = ["Yuriy Krasilnikov <yury.krasilnikov@gmail.com>", "Deeray Ltd."]

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
symphonia-format-isomp4 = { path = "crates/third-party/symphonia-format-isomp4" }
symphonia-format-mkv = { path = "crates/third-party/symphonia-format-mkv" }
symphonia-format-ogg = { path = "crates/third-party/symphonia-format-ogg" }
symphonia-codec-vorbis = { path = "crates/third-party/symphonia-codec-vorbis" }
symphonia-format-riff = { path = "crates/third-party/symphonia-format-riff" }
