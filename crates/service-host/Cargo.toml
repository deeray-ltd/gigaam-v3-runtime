[package]
name = "gigaam-service-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared GigaAM v3 service operations, admission, and process lifecycle."
authors.workspace = true
keywords = ["asr", "speech-recognition", "streaming", "server", "websocket"]
categories = ["multimedia::audio", "web-programming::http-server"]
publish = false

[dependencies]
gigaam-model-package = { path = "../model-package" }
gigaam-primitives = { path = "../primitives" }
gigaam-audio = { path = "../audio", features = ["decoders"] }
gigaam-recognition = { path = "../recognition", default-features = false }
gigaam-transcription = { path = "../transcription" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "matched-path", "original-uri", "tokio", "tower-log", "tracing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

[dev-dependencies]
# The combined fixture tests exercise both linked wire implementations.
axum = { version = "0.8.9", default-features = false, features = ["http1", "matched-path", "original-uri", "tokio", "tower-log", "tracing", "ws", "multipart"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["miniz_oxide"] }
tungstenite = { version = "0.29.0", default-features = false }

[features]
default = []
cuda = ["gigaam-recognition/cuda"]
tensorrt = ["cuda", "gigaam-recognition/tensorrt"]
