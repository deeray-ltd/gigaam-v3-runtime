[package]
name = "gigaam-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GigaAM v3 HTTP/WebSocket speech-recognition service with scheduled recognition and application transcription flows."
authors.workspace = true
keywords = ["asr", "speech-recognition", "streaming", "server", "websocket"]
categories = ["multimedia::audio", "web-programming::http-server"]
publish = false

[[bin]]
name = "asr-serve"
path = "src/main.rs"

[lib]
name = "gigaam_service"
path = "src/lib.rs"

[dependencies]
gigaam-audio = { path = "../audio" }
gigaam-format-wav = { path = "../format-wav" }
gigaam-format-raw = { path = "../format-raw" }
gigaam-format-codecs = { path = "../format-codecs" }
gigaam-service-host = { path = "../service-host", default-features = false }
gigaam-api-native = { path = "../api-native" }
gigaam-api-openai = { path = "../api-openai" }
gigaam-recognition = { path = "../recognition", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "matched-path", "original-uri", "tokio", "tower-log", "tracing"] }

[dev-dependencies]
gigaam-audio = { path = "../audio" }
gigaam-model-package = { path = "../model-package" }
gigaam-transcription = { path = "../transcription" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "matched-path", "original-uri", "tokio", "tower-log", "tracing", "ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

[features]
# Preserve the established CUDA default for normal service builds. Disable default features
# for a CPU-only service artifact; TensorRT depends on CUDA and is selected explicitly at runtime.
default = ["cuda"]
cuda = ["gigaam-service-host/cuda"]
# Opt-in service integration test requiring the external model pack and binary fixtures.
golden-tests = []
# TensorRT selects Recognition's TRT execution provider and its required CUDA support.
tensorrt = ["cuda", "gigaam-service-host/tensorrt"]

[[test]]
name = "http_golden"
required-features = ["golden-tests"]
